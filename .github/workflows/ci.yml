name: ci

on:
  push:
    branches: [main, dev, grunt, "grunt-**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no infrastructure identifiers or credentials in the tree
        run: node scripts/check-no-infra.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: contracts check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run contracts:check
      - name: beacon library check
        run: npm run beacon:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: control page
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
